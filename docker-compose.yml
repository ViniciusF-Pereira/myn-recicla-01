services:
  Recicla:
    build: .
    container_name: myn-Recicla-01
    ports:
      - "5188:5188"
    environment:
      MYN_DADOS: /data
      MYN_GATEWAY_TOKEN_FILE: /tmp/myn-recyla-token.txt
      TTL: "1800000"
    volumes:
      - Recicla-dados:/data
    restart: unless-stopped

volumes:
  Recicla-dados:
