name: Extensão e testes

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run extensao
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: myn-recicla-extensao
          path: site/extensao/myn-recicla-extensao.zip
          if-no-files-found: error

  liberar:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testar
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: myn-recicla-extensao
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/myn-recicla-extensao.zip
          generate_release_notes: true
